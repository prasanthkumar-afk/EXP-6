<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Student Result Management System</h2>
    
    <!-- Input Form -->
    <form id="resultForm">
      <div class="form-group">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name">
      </div>

      <div class="form-group">
        <label for="rollNo">Roll Number:</label>
        <input type="text" id="rollNo" placeholder="Enter roll number">
      </div>

      <div class="form-group">
        <label for="subject1">Subject 1 Marks (out of 100):</label>
        <input type="number" id="subject1" min="0" max="100" placeholder="0 - 100">
      </div>

      <div class="form-group">
        <label for="subject2">Subject 2 Marks (out of 100):</label>
        <input type="number" id="subject2" min="0" max="100" placeholder="0 - 100">
      </div>

      <div class="form-group">
        <label for="subject3">Subject 3 Marks (out of 100):</label>
        <input type="number" id="subject3" min="0" max="100" placeholder="0 - 100">
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-add">Add Result</button>
        <button type="button" id="clearBtn" class="btn btn-clear">Clear Form</button>
      </div>
    </form>

    <!-- Results Table -->
    <h3>Student Results</h3>
    <div class="table-responsive">
      <table id="resultTable">
        <thead>
          <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Total Marks</th>
            <th>Percentage</th>
            <th>Grade</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dynamically populated via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
